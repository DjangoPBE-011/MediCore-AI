components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
          readOnly: true
        patient_name:
          type: string
          readOnly: true
        family_member:
          type: integer
          nullable: true
        doctor:
          type: integer
        doctor_name:
          type: string
          readOnly: true
        specialization:
          type: string
          readOnly: true
        room:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
          default: pending
        status_label:
          type: string
          readOnly: true
        reason:
          type: string
          maxLength: 200
        cancel_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancel_reason
      - created_at
      - date
      - doctor
      - doctor_name
      - id
      - patient
      - patient_name
      - room
      - specialization
      - status
      - status_label
      - time
    AppointmentStatusEnum:
      enum:
      - pending
      - confirmed
      - in_progress
      - done
      - cancelled
      - no_show
      type: string
      description: |-
        * `pending` - Kutilmoqda
        * `confirmed` - Tasdiqlangan
        * `in_progress` - Qabul jarayonida
        * `done` - Yakunlangan
        * `cancelled` - Bekor qilingan
        * `no_show` - Kelmagan
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
        user_name:
          type: string
          readOnly: true
          default: ''
        role:
          type: string
          maxLength: 10
        action:
          type: string
          maxLength: 60
        object_type:
          type: string
          maxLength: 60
        object_id:
          type: string
          maxLength: 40
        detail: {}
        ip:
          type: string
          nullable: true
      required:
      - action
      - created_at
      - id
      - user_name
    BlankEnum:
      enum:
      - ''
    BloodGroupEnum:
      enum:
      - O+
      - O-
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      type: string
      description: |-
        * `O+` - O (I) +
        * `O-` - O (I) −
        * `A+` - A (II) +
        * `A-` - A (II) −
        * `B+` - B (III) +
        * `B-` - B (III) −
        * `AB+` - AB (IV) +
        * `AB-` - AB (IV) −
    Certificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        doctor:
          type: integer
          readOnly: true
        doctor_name:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/CertificateKindEnum'
        conclusion:
          type: string
        diagnosis:
          type: integer
          nullable: true
        diagnosis_text:
          type: string
          readOnly: true
          default: ''
        valid_until:
          type: string
          format: date
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CertificateStatusEnum'
          readOnly: true
        effective_status:
          type: string
          readOnly: true
        status_label:
          type: string
          readOnly: true
        reject_reason:
          type: string
          readOnly: true
        cancel_reason:
          type: string
          readOnly: true
        signature_serial:
          type: string
          readOnly: true
        signed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        qr_token:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancel_reason
      - created_at
      - diagnosis_text
      - doctor
      - doctor_name
      - effective_status
      - id
      - number
      - patient
      - patient_name
      - qr_token
      - reject_reason
      - signature_serial
      - signed_at
      - status
      - status_label
    CertificateKindEnum:
      enum:
      - pool
      - sport
      - school
      - work
      - sick
      - other
      type: string
      description: |-
        * `pool` - Bassein
        * `sport` - Sport
        * `school` - Maktab (086/u)
        * `work` - Ish joyi
        * `sick` - Kasallik varaqasi
        * `other` - Boshqa
    CertificateStatusEnum:
      enum:
      - draft
      - pending
      - approved
      - rejected
      - cancelled
      - expired
      type: string
      description: |-
        * `draft` - Qoralama
        * `pending` - Tasdiqlash kutilmoqda
        * `approved` - Tasdiqlangan
        * `rejected` - Rad etilgan
        * `cancelled` - Bekor qilingan
        * `expired` - Muddati tugagan
    Device:
