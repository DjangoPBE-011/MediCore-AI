services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: medicore, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment: {DB_NAME: medicore, DB_USER: postgres, DB_PASSWORD: postgres, DB_HOST: db, DB_PORT: '5432', DEBUG: '1'}
    ports: ['8000:8000']
    depends_on: [db]
volumes: {pgdata: {}}
